[package]
name = "oriel"
version = "0.1.0"
description = "Oriel personal workspace"
edition = "2021"
publish = false

[workspace]
members = ["crates/oriel-core"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["unstable"] }
oriel-core = { path = "crates/oriel-core" }
serde = { version = "=1.0.229", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_System_Com", "Win32_UI_Shell"] }
